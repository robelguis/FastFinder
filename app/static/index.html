<script>
    let currentCharacterData = null;

    async function loadOptions() {
      try {
        const res = await fetch('/api/options');
        const data = await res.json();

        const ancSelect = document.getElementById('ancestrySelect');
        if (ancSelect && data.ancestries) {
          ancSelect.innerHTML = '<option value="">Any Ancestry</option>';
          data.ancestries.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a;
            opt.textContent = a;
            ancSelect.appendChild(opt);
          });
        }

        window.cachedSubclasses = data.subclasses || {};
        const subSelect = document.getElementById('subclassSelect');
        const clsSelect = document.getElementById('classSelect');

        function updateSubclassesForClass(selectedClass) {
          if (!subSelect) return;
          subSelect.innerHTML = '<option value="">Any Subclass</option>';
          if (!selectedClass) return;

          const key = selectedClass.toLowerCase().trim();
          const opts = (window.cachedSubclasses && window.cachedSubclasses[key]) ? window.cachedSubclasses[key] : [];
          opts.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            subSelect.appendChild(opt);
          });
        }

        if (clsSelect && data.classes) {
          clsSelect.innerHTML = '<option value="">Any Class</option>';
          data.classes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            clsSelect.appendChild(opt);
          });
          clsSelect.addEventListener('change', () => {
            updateSubclassesForClass(clsSelect.value);
          });
          if (clsSelect.value) {
            updateSubclassesForClass(clsSelect.value);
          }
        }

        const bgSelect = document.getElementById("backgroundSelect");
        if (bgSelect && data.backgrounds) {
          bgSelect.innerHTML = '<option value="">Any Background</option>';
          data.backgrounds.forEach(b => {
            const opt = document.createElement("option");
            opt.value = b;
            opt.textContent = b;
            bgSelect.appendChild(opt);
          });
        }

        const archSelect = document.getElementById("archetypeSelect");
        if (archSelect && data.archetypes) {
          archSelect.innerHTML = '<option value="">Any Archetype</option>';
          data.archetypes.forEach(a => {
            const opt = document.createElement("option");
            opt.value = a;
            opt.textContent = a;
            archSelect.appendChild(opt);
          });
          archSelect.addEventListener("change", () => {
            const dedCheck = document.getElementById("dedicationToggle");
            const lvlSelect = document.getElementById("levelSelect");
            if (archSelect.value) {
              if (dedCheck) dedCheck.checked = true;
              if (lvlSelect && parseInt(lvlSelect.value) < 2) {
                lvlSelect.value = "2";
              }
            }
          });
        }
      } catch (err) {
        console.error("Failed to load options", err);
      }
    }

    function formatMod(val) {
      if (val === undefined || val === null) return "+0";
      return val >= 0 ? `+${val}` : `${val}`;
    }

    function renderSpellList(containerId, spells) {
      const box = document.getElementById(containerId);
      if (!box) return;
      box.innerHTML = '';
      if (!Array.isArray(spells)) return;
      spells.forEach(s => {
        const card = document.createElement('div');
        card.className = 'detail-card';
        card.innerHTML = `
          <div class="detail-card-head">
            <span>${s.name}</span>
            <span style="font-size: 0.7rem; color: #64748b;">${s.actions || ''}</span>
          </div>
          <div class="detail-card-meta">Range: ${s.range || 'Touch'} | ${s.targets ? 'Targets: ' + s.targets + ' | ' : ''}${s.defense ? 'Defense: ' + s.defense + ' | ' : ''}Traits: [${(s.traits || []).join(', ')}]</div>
          <div class="detail-card-body">${s.description || s.summary || ''}</div>
        `;
        box.appendChild(card);
      });
    }

    function renderSlotTrackers(slots) {
      const container = document.getElementById('slotTrackerContainer');
      if (!container) return;
      container.innerHTML = '';
      if (!Array.isArray(slots) || slots.length === 0) return;

      slots.forEach(slot => {
        const bar = document.createElement('div');
        bar.className = 'slot-tracker-bar';
        
        let pipsHtml = '';
        for (let i = 0; i < slot.max_slots; i++) {
          pipsHtml += `<input type="checkbox" class="slot-checkbox" title="Check when spell slot is cast">`;
        }

        bar.innerHTML = `
          <span>RANK ${slot.rank} SPELL SLOTS (${slot.max_slots} MAX)</span>
          <div class="slot-pips">${pipsHtml}</div>
        `;
        container.appendChild(bar);
      });
    }

    function renderConsumables(consumables) {
      const container = document.getElementById('consumablesContainer');
      if (!container) return;
      container.innerHTML = '';
      if (!Array.isArray(consumables) || consumables.length === 0) {
        container.innerHTML = '<span style="font-size: 0.75rem; color: #64748b;">None</span>';
        return;
      }

      consumables.forEach(c => {
        const item = document.createElement('div');
        item.className = 'consumable-pill';
        item.innerHTML = `
          <div>
            <strong>${c.name}</strong>
            <span style="font-size: 0.7rem; color: #475569; display: block;">${c.description}</span>
          </div>
          <span class="qty-tag">QTY: ${c.quantity}</span>
        `;
        container.appendChild(item);
      });
    }

    function updateLevelUpControls(level) {
      const lvl = parseInt(level, 10) || 1;
      const btnDown = document.getElementById("btnLevelDown");
      const btnUp = document.getElementById("btnLevelUp");
      const sel = document.getElementById("sheetLevelSelect");

      if (btnDown) {
        btnDown.disabled = (lvl <= 1);
        btnDown.textContent = "-";
      }
      if (btnUp) {
        btnUp.disabled = (lvl >= 20);
        btnUp.textContent = "+";
      }
      if (sel) {
        sel.value = String(lvl);
      }
    }

    function renderSheet(data) {
      window.currentCharacterData = data;
      currentCharacterData = data;
      const currentLevel = data.level || 1;
      
      const classDisplay = data.subclass ? `${data.character_class} (${data.subclass.name})` : data.character_class;
      document.getElementById('sheetClass').textContent = classDisplay;
      
      const archBadge = document.getElementById('sheetArchetypeBadge');
      if (data.archetype && currentLevel >= 2) {
        archBadge.textContent = `${data.archetype} Dedication`;
        archBadge.style.display = 'inline-block';
      } else {
        archBadge.style.display = 'none';
      }

      document.getElementById('sheetLevel').textContent = currentLevel;
      updateLevelUpControls(currentLevel);

      // Populate Ancestry Description Box
      const ancDescEl = document.getElementById("ancestryBoxDesc");
      const ancTitleEl = document.getElementById("ancestryBoxTitle");
      if (ancTitleEl) {
        ancTitleEl.textContent = `${data.ancestry || "Ancestry"} Description`;
      }
      if (ancDescEl) {
        ancDescEl.textContent = data.ancestry_description || "Lore details not found in compendium.";
      }

      // Populate Background Description Box
      const bgBoxEl = document.getElementById("backgroundBox");
      const bgTitleEl = document.getElementById("backgroundBoxTitle");
      const bgDescEl = document.getElementById("backgroundBoxDesc");
      if (bgBoxEl) {
        bgTitleEl.textContent = `${data.background || "Background"} Description`;
        bgDescEl.textContent = data.background_description || "Background details not found in compendium.";
      }

      // Populate Languages Box
      const langContainer = document.getElementById("characterLanguages");
      if (langContainer) {
        const langs = (data.languages && data.languages.length > 0) ? data.languages : ["Common"];
        langContainer.innerHTML = langs.map(l => 
          `<span style="background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1; padding: 0.15rem 0.45rem; border-radius: 3px; font-weight: 600;">${l}</span>`
        ).join("");
      }

      // Populate Archetype / Dedication Box
      const archBoxEl = document.getElementById("archetypeBox");
      const archTitleEl = document.getElementById("archetypeBoxTitle");
      const archDescEl = document.getElementById("archetypeBoxDesc");
      if (archBoxEl) {
        if (data.archetype && currentLevel >= 2) {
          archBoxEl.style.display = "block";
          archTitleEl.textContent = `${data.archetype} Dedication`;
          archDescEl.textContent = data.archetype_description || `Grants dedication feats and training for the ${data.archetype} archetype.`;
        } else {
          archBoxEl.style.display = "none";
        }
      }

      // Attributes
      const attrs = data.attributes || {};
      document.getElementById('statStr').textContent = formatMod(attrs.str ?? attrs.strength);
      document.getElementById('statDex').textContent = formatMod(attrs.dex ?? attrs.dexterity);
      document.getElementById('statCon').textContent = formatMod(attrs.con ?? attrs.constitution);
      document.getElementById('statInt').textContent = formatMod(attrs.int ?? attrs.intelligence);
      document.getElementById('statWis').textContent = formatMod(attrs.wis ?? attrs.wisdom);
      document.getElementById('statCha').textContent = formatMod(attrs.cha ?? attrs.charisma);

      // Defenses & HP
      document.getElementById('vitalHp').textContent = data.defenses?.hp ?? 0;
      const shieldBonus = data.defenses?.shield_bonus ?? 0;
      const acBase = data.defenses?.ac ?? 10;
      document.getElementById('vitalAc').textContent = shieldBonus > 0 ? `${acBase} (+${shieldBonus} Shield)` : acBase;
      document.getElementById('vitalSpeed').textContent = `${data.speed ?? 25} ft`;
      document.getElementById('vitalPerception').textContent = formatMod(data.perception?.modifier);

      // Saves
      document.getElementById('vitalFort').textContent = formatMod(data.defenses?.fortitude?.modifier);
      const rankLabel = (r) => ({ L: 'Legendary', M: 'Master', E: 'Expert', T: 'Trained' }[r] || 'Trained');
      document.getElementById('rankFort').textContent = rankLabel(data.defenses?.fortitude?.rank_letter);
      document.getElementById('vitalRef').textContent = formatMod(data.defenses?.reflex?.modifier);
      document.getElementById('rankRef').textContent = rankLabel(data.defenses?.reflex?.rank_letter);
      document.getElementById('vitalWill').textContent = formatMod(data.defenses?.will?.modifier);
      document.getElementById('rankWill').textContent = rankLabel(data.defenses?.will?.rank_letter);

      // Strikes & MAP
      const strikesTbody = document.getElementById('strikesTbody');
      strikesTbody.innerHTML = '';
      (data.equipment?.strikes || []).forEach(s => {
        const row = document.createElement('tr');
        const mapSec = s.map_second !== undefined ? formatMod(s.map_second) : formatMod(s.attack_bonus - 5);
        const mapThird = s.map_third !== undefined ? formatMod(s.map_third) : formatMod(s.attack_bonus - 10);
        const mapDisplay = `${formatMod(s.attack_bonus)} / ${mapSec} / ${mapThird}`;
        row.innerHTML = `
          <td><span class="w-name">${s.name}</span></td>
          <td class="w-map">${mapDisplay}</td>
          <td class="w-dmg">${s.damage_dice} ${s.damage_type}</td>
          <td class="w-traits">${(s.traits || []).join(', ')}</td>
        `;
        strikesTbody.appendChild(row);
      });

      // Skills Ledger
      const skillsContainer = document.getElementById('skillsContainer');
      skillsContainer.innerHTML = '';
      const rawSkills = Array.isArray(data.all_skills) ? data.all_skills : (Array.isArray(data.trained_skills) ? data.trained_skills : []);
      rawSkills.forEach(sk => {
        const row = document.createElement('div');
        row.className = 'skill-line';
        const rankLetter = sk.rank_letter || (sk.rank >= 4 ? 'E' : (sk.rank >= 2 ? 'T' : 'U'));
        const badgeClass = rankLetter === 'E' ? 'badge-e' : (rankLetter === 'T' ? 'badge-t' : 'badge-u');
        row.innerHTML = `
          <div class="skill-meta">
            <span class="skill-badge ${badgeClass}">${rankLetter}</span>
            <span class="skill-title">${sk.name}</span>
            <span class="skill-attr-tag">(${sk.attribute || 'mod'})</span>
          </div>
          <span class="skill-mod-val">${formatMod(sk.modifier)}</span>
        `;
        skillsContainer.appendChild(row);
      });

      // Spellcasting Section
      const spellsSection = document.getElementById('spellsSection');
      if (data.spellcasting) {
        spellsSection.style.display = 'block';
        document.getElementById('spellTraditionMeta').textContent = `${data.spellcasting.tradition} Tradition (${data.spellcasting.casting_attribute})`;
        document.getElementById('spellDc').textContent = data.spellcasting.spell_dc || 10;
        document.getElementById('spellAttack').textContent = formatMod(data.spellcasting.spell_attack);
        
        renderSlotTrackers(data.spellcasting.slots);
        renderSpellList('cantripsContainer', data.spellcasting.cantrips);

        for (let r = 1; r <= 10; r++) {
          const spellsForRank = data.spellcasting[`rank_${r}_spells`];
          const hdr = document.getElementById(`rank${r}Header`);
          const box = document.getElementById(`rank${r}Container`);
          if (spellsForRank && spellsForRank.length > 0) {
            if (hdr) hdr.style.display = 'block';
            if (box) renderSpellList(`rank${r}Container`, spellsForRank);
          } else {
            if (hdr) hdr.style.display = 'none';
            if (box) box.innerHTML = '';
          }
        }
      } else {
        spellsSection.style.display = 'none';
      }

      // Actions, Reactions & Passive Feats Sections
      const actionsSec = document.getElementById('actionsSection');
      const actionsBox = document.getElementById('actionsContainer');
      const reactionsSec = document.getElementById('reactionsSection');
      const reactionsBox = document.getElementById('reactionsContainer');
      const featsBox = document.getElementById('featsContainer');
      actionsBox.innerHTML = '';
      reactionsBox.innerHTML = '';
      featsBox.innerHTML = '';

      const actionFeats = [];
      const reactionFeats = [];
      const passiveFeats = [];

      (data.feats || []).forEach(f => {
        const rawCost = (f.action_cost || '').toString().trim().toLowerCase();
        const descLow = (f.description || '').toLowerCase();
        if (rawCost.includes('reaction') || rawCost === 'r' || descLow.startsWith('trigger:')) {
          reactionFeats.push(f);
        } else if (rawCost.includes('free') || rawCost === 'f' || ['1', '2', '3', '1 action', '2 actions', '3 actions', '1 to 3 actions'].includes(rawCost)) {
          actionFeats.push(f);
        } else {
          passiveFeats.push(f);
        }
      });

      const renderFeatCard = (f, badgeText, badgeBg, badgeColor) => {
        const card = document.createElement('div');
        const isArch = (f.category || '').toLowerCase().includes('archetype');
        card.className = isArch ? 'detail-card arch-feat' : 'detail-card';
        card.innerHTML = `
          <div class="detail-card-head">
            <span>${f.name}</span>
            <span style="font-size: 0.68rem; font-weight: 800; padding: 0.1rem 0.4rem; border-radius: 4px; background: ${badgeBg}; color: ${badgeColor};">${badgeText}</span>
          </div>
          <div class="detail-card-meta">${f.category} | Traits: [${(f.traits || []).join(', ')}]</div>
          <div class="detail-card-body">${f.description || ''}</div>
        `;
        return card;
      };

      if (actionFeats.length > 0) {
        actionsSec.style.display = 'block';
        document.getElementById('actionsCountBadge').textContent = `${actionFeats.length} ACTIVE`;
        actionFeats.forEach(f => {
          const c = (f.action_cost || '').toString().trim();
          const label = c.toLowerCase().includes('free') ? 'Free Action' : `${c} Action${c === '1' ? '' : 's'}`;
          actionsBox.appendChild(renderFeatCard(f, label, '#dbeafe', '#1e40af'));
        });
      } else {
        actionsSec.style.display = 'none';
      }

      if (reactionFeats.length > 0) {
        reactionsSec.style.display = 'block';
        document.getElementById('reactionsCountBadge').textContent = `${reactionFeats.length} TRIGGERED`;
        reactionFeats.forEach(f => {
          reactionsBox.appendChild(renderFeatCard(f, 'Reaction', '#fef3c7', '#92400e'));
        });
      } else {
        reactionsSec.style.display = 'none';
      }

      passiveFeats.forEach(f => {
        featsBox.appendChild(renderFeatCard(f, 'Passive', '#f1f5f9', '#475569'));
      });

      // Currency, Consumables & Equipment
      const moneyBox = document.getElementById('moneyContainer');
      moneyBox.innerHTML = '';
      if (data.equipment?.money) {
        moneyBox.innerHTML = `
          <span class="coin-badge">${data.equipment.money.gp || 0} GP</span>
          <span class="coin-badge">${data.equipment.money.sp || 0} SP</span>
          <span class="coin-badge">${data.equipment.money.cp || 0} CP</span>
        `;
      }
      
      renderConsumables(data.equipment?.consumables || []);

      // Render Partner Creatures (Eidolon, Animal Companion, Familiar)
      const container = document.getElementById("partnerCreaturesContainer");
      if (container) {
        container.innerHTML = "";
        const allPartners = [];
        if (data.companion && data.companion.name) allPartners.push(data.companion);
        if (Array.isArray(data.additional_partners)) {
          data.additional_partners.forEach(p => { if (p && p.name) allPartners.push(p); });
        }

        allPartners.forEach((comp) => {
          const isEidolon = (comp.creature_type || "").toLowerCase().includes("eidolon");
          const headerTitle = comp.creature_type ? comp.creature_type.toUpperCase() : "ANIMAL COMPANION";
          const typeDetail = comp.sub_type || comp.species || comp.tradition || "";
          const stageText = comp.stage || "";
          const badgeText = typeDetail ? `${stageText} (${typeDetail})`.trim() : stageText;

          const strikesHtml = (comp.strikes || []).map(st => `
            <tr>
              <td><span class="w-name">${st.name}</span></td>
              <td class="w-map">${formatMod(st.attack_bonus)} / ${formatMod(st.map_second)} / ${formatMod(st.map_third)}</td>
              <td class="w-dmg">${st.damage_dice} ${st.damage_type}</td>
              <td class="w-traits">${(st.traits || []).join(", ")}</td>
            </tr>
          `).join("");

          const primaryTitle = comp.primary_ability ? "Primary Ability" : (comp.support_benefit ? "Support Benefit" : "");
          const primaryText = comp.primary_ability || comp.support_benefit || "";
          const secondaryTitle = comp.secondary_ability ? "Unique Ability" : (comp.advanced_maneuver ? "Advanced Maneuver" : "");
          const secondaryText = comp.secondary_ability || comp.advanced_maneuver || "";

          const card = document.createElement("div");
          card.className = "sheet-box";
          card.style.cssText = "margin-bottom: 0.8rem; border-left: 3.5px solid #16a34a;";

          const traitBadges = (comp.traits || ["Animal", "Minion"]).map(t =>
            `<span style="background: #e2e8f0; color: #334155; font-size: 0.62rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; text-transform: uppercase;">${t}</span>`
          ).join(" ");

          const attrs = comp.attributes || { STR: 2, DEX: 2, CON: 2, INT: -4, WIS: 1, CHA: -4 };
          const attrHtml = Object.entries(attrs).map(([k, v]) => `
            <div style="text-align: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 4px; min-width: 38px;">
              <div style="font-size: 0.58rem; color: #64748b; font-weight: 800;">${k}</div>
              <div style="font-size: 0.78rem; font-weight: 800; color: #0f172a;">${formatMod(v)}</div>
            </div>
          `).join("");

          const skillsMap = comp.skills || {};
          const skillsList = Object.entries(skillsMap).map(([s, m]) => `<strong>${s}</strong> ${formatMod(m)}`).join(", ");
          const sensesText = comp.senses || "Low-Light Vision, Scent (Imprecise) 30 ft";

          card.innerHTML = `
            <div class="sheet-box-title" style="background: #14532d; display: flex; justify-content: space-between; align-items: center;">
              <span>${headerTitle}</span>
              <span style="font-size: 0.65rem; color: #86efac; font-weight: 800; text-transform: uppercase;">${badgeText}</span>
            </div>
            <div class="sheet-box-content">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem;">
                <div>
                  <span style="font-size: 1rem; font-weight: 800; color: #0f172a;">${comp.name}</span>
                  <div style="margin-top: 2px;">${traitBadges}</div>
                </div>
                <div style="text-align: right; font-size: 0.72rem; color: #475569; font-weight: 700;">
                  Size: ${comp.size || "Medium"} | Speed: ${comp.speed || "25 ft"} | Perception: ${formatMod(comp.perception)}
                </div>
              </div>

              <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; padding: 0.25rem 0.5rem; font-size: 0.72rem; color: #166534; margin: 0.35rem 0;">
                <span style="font-weight: 800;">Command an Animal (1 Action):</span> Grants companion 2 actions this turn (Stride, Strike, Support, etc.).
              </div>

              <div style="display: flex; gap: 0.35rem; justify-content: space-between; margin-bottom: 0.4rem;">
                ${attrHtml}
              </div>

              <div class="defense-row" style="margin-bottom: 0.4rem;">
                <div class="defense-metric">
                  <span class="lbl">AC</span>
                  <span class="val">${comp.ac}</span>
                </div>
                <div class="defense-metric">
                  <span class="lbl">Max HP</span>
                  <span class="val" style="color: #15803d;">${isEidolon ? `${comp.hp} (Shared)` : comp.hp}</span>
                </div>
                <div class="defense-metric">
                  <span class="lbl">Fort</span>
                  <span class="val">${formatMod(comp.fortitude)}</span>
                </div>
                <div class="defense-metric">
                  <span class="lbl">Ref</span>
                  <span class="val">${formatMod(comp.reflex)}</span>
                </div>
                <div class="defense-metric">
                  <span class="lbl">Will</span>
                  <span class="val">${formatMod(comp.will)}</span>
                </div>
              </div>

              <div style="font-size: 0.72rem; line-height: 1.35; color: #334155; margin-bottom: 0.4rem; padding: 0.25rem 0.4rem; background: #f8fafc; border-radius: 4px; border: 1px solid #e2e8f0;">
                <div><span style="font-weight: 700; color: #0f172a;">Senses:</span> ${sensesText}</div>
                ${skillsList ? `<div><span style="font-weight: 700; color: #0f172a;">Skills:</span> ${skillsList}</div>` : ""}
              </div>

              <div style="margin-top: 0.4rem;">
                <div class="table-caption-bar">COMPANION STRIKES</div>
                <table class="fast-table">
                  <thead>
                    <tr><th>Action</th><th>Attack</th><th>Damage</th><th>Traits</th></tr>
                  </thead>
                  <tbody>${strikesHtml}</tbody>
                </table>
              </div>

              ${primaryText ? `
                <div class="detail-card" style="margin-top: 0.4rem;">
                  <div class="detail-card-head">${primaryTitle}</div>
                  <div class="detail-card-body">${primaryText}</div>
                </div>
              ` : ""}
              ${secondaryText ? `
                <div class="detail-card" style="margin-top: 0.4rem;">
                  <div class="detail-card-head">${secondaryTitle}</div>
                  <div class="detail-card-body">${secondaryText}</div>
                </div>
              ` : ""}
            </div>
          `;
          container.appendChild(card);
        });
      }

      const legacyComp = document.getElementById("companionSection");
      if (legacyComp) legacyComp.style.display = "none";

      const focusSection = document.getElementById("focusSection");
      if (data.focus_spells && data.focus_spells.spells && data.focus_spells.spells.length > 0) {
        focusSection.style.display = "block";
        document.getElementById("focusTraditionMeta").textContent = `${data.focus_spells.tradition} (${data.focus_spells.casting_attribute})`;
        document.getElementById("focusDc").textContent = data.focus_spells.spell_dc || 10;
        document.getElementById("focusAttack").textContent = formatMod(data.focus_spells.spell_attack);
        document.getElementById("focusPoolLabel").textContent = `FOCUS POOL (${data.focus_spells.max_focus_points} POINT${data.focus_spells.max_focus_points > 1 ? "S" : ""} MAX)`;

        const pipsContainer = document.getElementById("focusPipsContainer");
        pipsContainer.innerHTML = "";
        for (let i = 0; i < data.focus_spells.max_focus_points; i++) {
          pipsContainer.innerHTML += `<input type="checkbox" checked class="slot-checkbox" title="Checked = Available Focus Point. Uncheck when spent.">`;
        }

        renderSpellList("focusSpellsList", data.focus_spells.spells);
      } else {
        focusSection.style.display = "none";
      }

      const armorParts = [];
      if (data.equipment?.armor) armorParts.push(data.equipment.armor.name);
      if (data.equipment?.shield) armorParts.push(data.equipment.shield.name);
      document.getElementById('armorSpan').textContent = armorParts.length ? armorParts.join(', ') : 'None';
      document.getElementById('gearContainer').textContent = "Pack: " + (data.equipment?.gear || []).join(', ');
    }

    async function generate() {
      const nameInput = document.getElementById('charName').value.trim();
      const anc = document.getElementById('ancestrySelect').value;
      const cls = document.getElementById('classSelect').value;
      const sub = document.getElementById("subclassSelect") ? document.getElementById("subclassSelect").value : "";
      const bg = document.getElementById("backgroundSelect") ? document.getElementById("backgroundSelect").value : "";
      const arch = document.getElementById("archetypeSelect") ? document.getElementById("archetypeSelect").value : "";
      const lvl = document.getElementById('levelSelect').value || 1;
      const useDedication = document.getElementById('dedicationToggle')?.checked;

      const params = new URLSearchParams();
      if (arch && !["any", "any archetype", "none"].includes(arch.toLowerCase())) {
        params.append('archetype', arch);
      }
      if (nameInput) params.append('name', nameInput);
      if (anc) params.append('ancestry', anc);
      if (cls) params.append('class_name', cls);
      if (sub && !["any", "any subclass", "none"].includes(sub.toLowerCase())) {
        params.append('subclass', sub);
      }
      if (bg) params.append("background", bg);
      params.append('level', lvl);
      params.append('dedication', useDedication ? 'true' : 'false');

      try {
        const res = await fetch('/api/generate?' + params.toString());
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error((typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail)) || `Server error ${res.status}`);
        }
        const data = await res.json();
        renderSheet(data);
      } catch (err) {
        console.error("Generation failed:", err);
        alert(`Generation failed: ${err.message}`);
      }
    }

    function downloadFoundryJson() {
      if (!currentCharacterData) return;
      const params = new URLSearchParams();
      params.append('name', currentCharacterData.name);
      params.append('ancestry', currentCharacterData.ancestry);
      params.append('class_name', currentCharacterData.character_class);
      params.append('level', currentCharacterData.level || 1);
      const useDedication = document.getElementById('dedicationToggle')?.checked;
      params.append('dedication', useDedication ? 'true': 'false');
      window.location.href = '/api/export/foundry?' + params.toString();
    }

    // Epic Backstory Button Listener
    document.addEventListener('DOMContentLoaded', () => {
      const backstoryBtn = document.getElementById('backstoryBtn');
      if (backstoryBtn) {
        backstoryBtn.addEventListener('click', async () => {
          if (!currentCharacterData) {
            alert("Please generate a character sheet first!");
            return;
          }

          try {
            const response = await fetch('/api/epic-backstory', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(currentCharacterData)
            });

            if (!response.ok) {
              throw new Error("Failed to generate epic backstory.");
            }

            const data = await response.json();
            
            // Render/display chapters (fallback alert if modal function is missing)
            if (typeof displayEpicBackstoryModal === 'function') {
              displayEpicBackstoryModal(data.chapters);
            } else {
              alert(data.chapters.map(c => `${c.chapter}\n\n${c.narrative}`).join('\n\n---?\n\n'));
            }
          } catch (err) {
            alert("Error generating backstory: " + err.message);
          }
        });
      }
    });

    window.onload = async () => {
      await loadOptions();
      generate();
    };

    async function handleLevelStep(delta) {
      const char = window.currentCharacterData;
      if (!char) {
        alert("Please generate a character first.");
        return;
      }
      const currentLvl = parseInt(char.level, 10) || 1;
      const targetLvl = currentLvl + delta;
      if (targetLvl < 1 || targetLvl > 20) return;
      await applyTargetLevel(targetLvl);
    }

    async function handleLevelSelect(val) {
      const target = parseInt(val, 10) || 1;
      await applyTargetLevel(target);
    }

    async function applyTargetLevel(targetLvl) {
      const char = window.currentCharacterData;
      if (!char) {
        alert("Please generate a character first.");
        return;
      }

      const currentLvl = parseInt(char.level, 10) || 1;
      if (targetLvl === currentLvl) return;

      const btnDown = document.getElementById("btnLevelDown");
      const btnUp = document.getElementById("btnLevelUp");
      const sel = document.getElementById("sheetLevelSelect");

      try {
        if (btnDown) btnDown.disabled = true;
        if (btnUp) btnUp.disabled = true;
        if (sel) sel.disabled = true;

        const archEl = document.getElementById("archetypeSelect");
        const archVal = archEl ? archEl.value : "";
        const useDed = document.getElementById("dedicationToggle")?.checked;

        const reqBody = {
          character: char,
          target_level: targetLvl,
          use_dedication: !!useDed,
          archetype: (archVal && !["any", "any archetype", "none"].includes(archVal.toLowerCase())) ? archVal : null
        };

        const res = await fetch('/api/levelup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqBody)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          const detailMsg = Array.isArray(errData.detail)
            ? errData.detail.map(d => `${d.loc ? d.loc.join('.') + ': ' : ''}${d.msg}`).join(', ')
            : (typeof errData.detail === 'object' ? JSON.stringify(errData.detail) : errData.detail);
          throw new Error(detailMsg || `Server error ${res.status}`);
        }

        const updatedSheet = await res.json();
        renderSheet(updatedSheet);
      } catch (err) {
        console.error("Level change error:", err);
        alert(`Level transition failed: ${err.message}`);
        updateLevelUpControls(currentLvl);
      } finally {
        if (sel) sel.disabled = false;
        updateLevelUpControls(window.currentCharacterData?.level || targetLvl);
      }
    }

    function resetEverything() {
      const nameInput = document.getElementById("charNameInput") || document.getElementById("nameInput");
      if (nameInput) nameInput.value = "";

      const selects = [
        "ancestrySelect",
        "classSelect",
        "subclassSelect",
        "backgroundSelect",
        "archetypeSelect",
        "levelSelect"
      ];
      selects.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.selectedIndex = 0;
          el.value = (id === "levelSelect") ? "1" : "";
        }
      });

      const dedToggle = document.getElementById("dedicationToggle");
      if (dedToggle) dedToggle.checked = false;

      const sheetLvl = document.getElementById("sheetLevelSelect");
      if (sheetLvl) sheetLvl.value = "1";

      generate();
    }
</script>
